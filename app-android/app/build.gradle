plugins {
    id 'com.android.application'
}

// La firma: se il workflow trova la chiave nei "secrets" del repository firma con quella (così gli aggiornamenti
// si installano sopra la versione vecchia); altrimenti usa la chiave di debug.
def chiave = System.getenv('DH_KEYSTORE_FILE')

android {
    namespace 'it.daggerheart.telecomando'
    compileSdk 35

    defaultConfig {
        applicationId 'it.daggerheart.telecomando'
        minSdk 26
        targetSdk 35
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        release {
            if (chiave) {
                storeFile file(chiave)
                storePassword System.getenv('DH_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DH_KEY_ALIAS') ?: 'telecomando'
                keyPassword System.getenv('DH_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig chiave ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}
