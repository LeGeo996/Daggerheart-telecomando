<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120e0b">
<meta name="robots" content="noindex">
<title>Telecomando del PG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ebano: #120e0b; --legno: #1d1611; --ottone: #d4af37; --ottone-scuro: #7a5d22; --pergamena: #f2e4c4; --muto: #a8987a; --pf: #e0525a; --stress: #c48a3a; --speranza: #f3c64e; --arm: #8fb3d9; --pg: #d4af37; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--ebano); color: var(--pergamena); font: 15px/1.4 Inter, system-ui, sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 12px); user-select: none; -webkit-user-select: none;
    background: radial-gradient(120% 60% at 50% 100%, color-mix(in srgb, var(--pg) 16%, transparent), transparent 70%), var(--ebano); }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; border-bottom: 1px solid var(--ottone-scuro); }
  .gemma { width: 14px; height: 14px; transform: rotate(45deg); background: var(--pg); border: 1px solid var(--pergamena); box-shadow: 0 0 10px var(--pg); flex: none; }
  h1 { font: 800 21px/1.1 Cinzel, Georgia, serif; margin: 0; letter-spacing: .02em; }
  .classe { color: var(--muto); font-size: 12px; }
  .stato { margin-left: auto; font-size: 12px; color: var(--muto); text-align: right; white-space: nowrap; }
  .stato b { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #6b6b6b; margin-right: 5px; vertical-align: 0; }
  .stato.ok b { background: #5ad17a; box-shadow: 0 0 8px #5ad17a; } .stato.attesa b { background: #e3b341; } .stato.ko b { background: var(--pf); }
  .scena { font-size: 12px; color: var(--muto); padding: 6px 0 0; min-height: 1.4em; }
  .tracce { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; padding: 10px 0; }
  .traccia span { font-size: 12px; color: var(--muto); } .traccia strong { float: right; font-size: 13px; }
  .tacche { display: flex; gap: 3px; margin-top: 4px; } .tacche i { flex: 1; height: 8px; border-radius: 2px; background: #2c241c; border: 1px solid #3a2f24; }
  .pf .tacche i.on { background: var(--pf); border-color: var(--pf); } .stress .tacche i.on { background: var(--stress); border-color: var(--stress); }
  .speranza .tacche i { border-radius: 50%; height: 12px; flex: 0 0 12px; } .speranza .tacche i.on { background: var(--speranza); border-color: var(--speranza); box-shadow: 0 0 6px var(--speranza); }
  .armatura .tacche i.on { background: var(--arm); border-color: var(--arm); }
  .condizioni { display: flex; gap: 6px; flex-wrap: wrap; min-height: 0; } .condizioni em { font-style: normal; font-size: 12px; padding: 2px 9px; border-radius: 10px; border: 1px solid var(--pf); color: #ffb3b8; }
  .abilita { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 0 4px; }
  .abilita button { flex: 1 1 calc(50% - 8px); min-height: 52px; padding: 8px 10px; font: 600 14px/1.2 Inter, sans-serif; color: var(--pergamena); background: linear-gradient(180deg, #2d2117, #17110c); border: 1px solid var(--ottone-scuro); border-radius: 8px; text-align: left; }
  .abilita button:active { transform: scale(.97); } .abilita button.attivo { border-color: var(--pg); box-shadow: inset 0 0 0 1px var(--pg), 0 0 14px color-mix(in srgb, var(--pg) 45%, transparent); }
  .abilita button:focus-visible, select:focus-visible { outline: 2px solid var(--ottone); outline-offset: 2px; }
  .abilita label { flex: 1 1 100%; font-size: 12px; color: var(--muto); } .abilita select { width: 100%; min-height: 48px; margin-top: 4px; font: 600 14px Inter, sans-serif; color: var(--pergamena); background: #1d1611; border: 1px solid var(--ottone-scuro); border-radius: 8px; padding: 0 10px; }
  .abilita small { display: block; flex: 1 1 100%; color: var(--muto); font-size: 12px; margin-top: -2px; }
  .pad { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 230px; touch-action: none; }
  /* il medaglione: anello d'ottone che si accende del colore del PG */
  .medaglione { position: relative; width: min(74vw, 300px); aspect-ratio: 1; border-radius: 50%; touch-action: none;
    background: radial-gradient(circle, #1b140f 0 58%, #2a2016 59% 61%, #15100c 62%), var(--legno);
    border: 2px solid var(--ottone); box-shadow: 0 0 0 6px #1a130e, 0 0 0 7px var(--ottone-scuro), 0 0 34px color-mix(in srgb, var(--pg) 30%, transparent), inset 0 0 40px #000; }
  .medaglione::before, .medaglione::after { content: ''; position: absolute; left: 50%; top: 50%; width: 82%; height: 1px; background: linear-gradient(90deg, transparent, var(--ottone-scuro), transparent); transform: translate(-50%, -50%); }
  .medaglione::after { transform: translate(-50%, -50%) rotate(90deg); }
  .rosa { position: absolute; inset: 0; font: 600 11px Cinzel, serif; color: var(--muto); }
  .rosa span { position: absolute; } .rosa .n { top: 7%; left: 50%; transform: translateX(-50%); } .rosa .s { bottom: 7%; left: 50%; transform: translateX(-50%); } .rosa .o { left: 7%; top: 50%; transform: translateY(-50%); } .rosa .e { right: 7%; top: 50%; transform: translateY(-50%); }
  .pomello { position: absolute; left: 50%; top: 50%; width: 34%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
    background: radial-gradient(circle at 35% 30%, #fff8, transparent 40%), radial-gradient(circle, var(--pg), color-mix(in srgb, var(--pg) 45%, #000)); border: 2px solid var(--pergamena); box-shadow: 0 6px 18px #000, 0 0 22px var(--pg); }
  .medaglione.premuto { border-color: var(--pg); }
  .aiuto { text-align: center; color: var(--muto); font-size: 12px; min-height: 1.4em; }
  .errore { margin: auto 0; text-align: center; padding: 24px; } .errore h1 { margin-bottom: 10px; }
  @media (orientation: landscape) and (max-height: 560px) {
    body { flex-direction: row; flex-wrap: wrap; align-content: flex-start; gap: 0 18px; }
    header { flex: 1 1 100%; padding: 8px 0 6px; order: -2; } .scena, .aiuto { display: none; }
    .colonna { flex: 1 1 0; min-width: 0; overflow-y: auto; max-height: calc(100vh - 60px); }
    .pad { flex: 0 0 auto; width: min(46vw, 330px); min-height: 0; order: -1; }
    .medaglione { width: min(40vw, calc(100vh - 90px)); }
  }
  @media (prefers-reduced-motion: reduce) { .abilita button:active { transform: none; } }
</style>
</head>
<body>
<header>
  <div class="gemma" aria-hidden="true"></div>
  <div><h1 id="nome">Telecomando</h1><div class="classe" id="classe">collegamento in corso…</div></div>
  <div class="stato attesa" id="stato" role="status"><b></b><span id="stato-t">Collegamento…</span></div>
</header>
<div class="colonna">
  <div class="scena" id="scena"></div>
  <div class="aiuto" id="aiuto">Trascina il medaglione: avanti è lontano dalla telecamera del tavolo.</div>
  <div class="tracce" id="tracce"></div>
  <div class="condizioni" id="condizioni"></div>
  <div class="abilita" id="abilita"></div>
</div>
<div class="pad" id="pad"><div class="medaglione" id="medaglione" role="application" aria-label="Joystick: trascina per muovere il personaggio">
  <div class="rosa" aria-hidden="true"><span class="n">avanti</span><span class="s">indietro</span><span class="o">sinistra</span><span class="e">destra</span></div>
  <div class="pomello" id="pomello"></div>
</div></div>
<script>
    const MqttMini = (() => {
      const enc = new TextEncoder(), dec = new TextDecoder();
      const str = s => { const b = enc.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
      const lunghezza = n => { const out = []; do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; out.push(d); } while (n > 0); return out; };
      const pacchetto = (tipo, corpo) => new Uint8Array([tipo, ...lunghezza(corpo.length), ...corpo]);
      class MqttMini {
        constructor(url, opz) {
          this.url = url; this.o = Object.assign({ keepalive: 30, clientId: 'dh' + Math.random().toString(36).slice(2, 12) }, opz || {});
          this.ev = {}; this.iscrizioni = new Set(); this.buf = new Uint8Array(0); this.ws = null; this.collegato = false; this.chiuso = false; this.tentativi = 0; this.pid = 1; this.timer = null;
        }
        on(e, f) { (this.ev[e] = this.ev[e] || []).push(f); return this; }
        _emit(e, ...a) { (this.ev[e] || []).forEach(f => { try { f(...a); } catch (x) { console.warn('MqttMini', e, x); } }); }
        connect() {
          this.chiuso = false;
          return new Promise((ok, ko) => {
            let fatto = false;
            const fine = (err) => { if (fatto) return; fatto = true; err ? ko(err) : ok(this); };
            let ws;
            try { ws = new WebSocket(this.url, ['mqtt']); } catch (e) { fine(e); this._riprova(); return; }
            ws.binaryType = 'arraybuffer'; this.ws = ws; this.buf = new Uint8Array(0);
            this._emit('stato', 'connessione');
            ws.onopen = () => {
              const o = this.o, w = o.will;
              let flag = 0x02; const corpo = [...str('MQTT'), 4];
              if (w) flag |= 0x04 | (w.retain ? 0x20 : 0);
              if (o.username) flag |= 0x80; if (o.password) flag |= 0x40;
              corpo.push(flag, o.keepalive >> 8, o.keepalive & 255, ...str(o.clientId));
              if (w) corpo.push(...str(w.topic), ...str(w.payload));
              if (o.username) corpo.push(...str(o.username)); if (o.password) corpo.push(...str(o.password));
              ws.send(pacchetto(0x10, corpo));
            };
            ws.onmessage = e => { this._ricevi(new Uint8Array(e.data), fine); };
            ws.onerror = () => {};
            ws.onclose = () => {
              const era = this.collegato; this.collegato = false; clearInterval(this.timer);
              this._emit('stato', 'scollegato'); if (era) this._emit('close');
              fine(new Error('connessione chiusa')); if (!this.chiuso) this._riprova();
            };
          });
        }
        _riprova() {
          if (this.chiuso) return; const attesa = Math.min(15000, 800 * Math.pow(1.7, this.tentativi++));
          setTimeout(() => { if (!this.chiuso && !this.collegato) this.connect().catch(() => {}); }, attesa);
        }
        _ricevi(dati, fine) {
          const b = new Uint8Array(this.buf.length + dati.length); b.set(this.buf); b.set(dati, this.buf.length); this.buf = b;
          while (this.buf.length >= 2) {
            let mult = 1, len = 0, i = 1, d;
            do { if (i >= this.buf.length) return; d = this.buf[i++]; len += (d & 127) * mult; mult *= 128; } while (d & 128);
            if (this.buf.length < i + len) return;
            const tipo = this.buf[0], corpo = this.buf.slice(i, i + len); this.buf = this.buf.slice(i + len);
            this._pacchetto(tipo, corpo, fine);
          }
        }
        _pacchetto(tipo, c, fine) {
          const t = tipo >> 4;
          if (t === 2) {                                                       // CONNACK
            if (c[1] !== 0) { this._emit('stato', 'rifiutato'); fine(new Error('connessione rifiutata dal broker (' + c[1] + ')')); this.chiuso = true; try { this.ws.close(); } catch (e) {} return; }
            this.collegato = true; this.tentativi = 0; this._emit('stato', 'collegato');
            this.iscrizioni.forEach(f => this._sub(f));
            clearInterval(this.timer); this.timer = setInterval(() => { try { this.ws.send(new Uint8Array([0xC0, 0])); } catch (e) {} }, this.o.keepalive * 500);
            this._emit('open'); fine();
          } else if (t === 3) {                                                // PUBLISH (QoS 0)
            const tl = (c[0] << 8) | c[1], topic = dec.decode(c.slice(2, 2 + tl)), qos = (tipo >> 1) & 3;
            const testo = dec.decode(c.slice(2 + tl + (qos ? 2 : 0)));
            this._emit('message', topic, testo, !!(tipo & 1));
          }
        }
        _sub(filtro) { if (!this.collegato) return; const id = this.pid++ & 0xffff || 1; this.ws.send(pacchetto(0x82, [id >> 8, id & 255, ...str(filtro), 0])); }
        subscribe(filtro) { this.iscrizioni.add(filtro); this._sub(filtro); }
        publish(topic, testo, opz) {
          if (!this.collegato) return false;
          this.ws.send(pacchetto(0x30 | (opz && opz.retain ? 1 : 0), [...str(topic), ...enc.encode(testo)])); return true;
        }
        end() { this.chiuso = true; clearInterval(this.timer); try { if (this.collegato) this.ws.send(new Uint8Array([0xE0, 0])); this.ws.close(); } catch (e) {} this.collegato = false; }
      }
      return MqttMini;
    })();
    // Firma dei comandi: HMAC-SHA256 con la chiave del link, così chi legge il broker pubblico non può muovere i PG
    async function firmaTelecomando(chiave, testo) {
      const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(chiave), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
      const s = new Uint8Array(await crypto.subtle.sign('HMAC', k, new TextEncoder().encode(testo)));
      return Array.from(s.slice(0, 16), x => x.toString(16).padStart(2, '0')).join('');
    }

(() => {
  const BROKER_PREDEFINITO = 'wss://broker.hivemq.com:8884/mqtt';
  const h = new URLSearchParams(location.hash.slice(1)), stanza = h.get('s'), pc = h.get('p'), chiave = h.get('k'), broker = h.get('b') || BROKER_PREDEFINITO;
  const $ = id => document.getElementById(id);
  if (!stanza || !pc || !chiave || !/^[a-z0-9]{6,}$/.test(stanza) || !window.crypto || !crypto.subtle) {
    document.body.innerHTML = '<div class="errore"><h1>Link non valido</h1><p>' + (!window.crypto || !crypto.subtle ? 'Apri il telecomando da un indirizzo https.' : 'Questo link è incompleto. Chiedi al GM il link del tuo personaggio, oppure inquadra di nuovo il suo codice QR.') + '</p></div>';
    return;
  }
  const base = 'dhvtt/v1/' + stanza, mio = base + '/pg/' + pc;
  let seq = Date.now() * 1000, gmOnline = null, scheda = null, ultimoAgg = 0;
  const m = new MqttMini(broker, { clientId: 'dhpg-' + stanza.slice(0, 6) + '-' + Math.random().toString(36).slice(2, 8), keepalive: 20, will: { topic: mio + '/presenza', payload: JSON.stringify({ online: false }), retain: true } });
  const invia = async c => { if (!m.collegato) return; seq = Math.max(seq + 1, Date.now() * 1000); const s = seq; const sig = await firmaTelecomando(chiave, pc + '|' + s + '|' + JSON.stringify(c)); m.publish(mio + '/cmd', JSON.stringify({ seq: s, c, sig })); };
  const statoUI = () => {
    const el = $('stato'), t = $('stato-t');
    if (!m.collegato) { el.className = 'stato ko'; t.textContent = navigator.onLine === false ? 'Senza rete' : 'Riconnessione…'; return; }
    if (gmOnline === false) { el.className = 'stato attesa'; t.textContent = 'GM non collegato'; return; }
    if (!scheda) { el.className = 'stato attesa'; t.textContent = 'In attesa del GM'; return; }
    el.className = 'stato ok'; t.textContent = 'Al tavolo';
  };
  m.on('stato', statoUI);
  m.on('open', () => { m.publish(mio + '/presenza', JSON.stringify({ online: true, ts: Date.now() }), { retain: true }); invia({ tipo: 'ciao' }); statoUI(); });
  m.on('message', (topic, testo) => {
    let d = null; try { d = JSON.parse(testo); } catch (e) { return; }
    if (topic === base + '/gm') { gmOnline = !!(d && d.online); statoUI(); return; }
    if (topic === mio + '/stato') { scheda = d; ultimoAgg = Date.now(); disegna(); statoUI(); }
  });
  m.subscribe(base + '/gm'); m.subscribe(mio + '/stato');
  m.connect().catch(() => statoUI());
  window.addEventListener('online', statoUI); window.addEventListener('offline', statoUI);

  // ---- scheda ----
  const tacche = (v, max, n) => { const k = Math.max(0, Math.min(n || max, max)); let s = ''; for (let i = 0; i < k; i++) s += '<i class="' + (i < v ? 'on' : '') + '"></i>'; return s; };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  function disegna() {
    const d = scheda; if (!d) return;
    document.documentElement.style.setProperty('--pg', /^#[0-9a-f]{3,8}$/i.test(d.colore) ? d.colore : '#d4af37');
    $('nome').textContent = d.nome || 'Personaggio'; $('classe').textContent = d.classe || ''; document.title = (d.nome || 'PG') + ' · telecomando';
    $('scena').textContent = d.scena ? 'Scena: ' + d.scena : '';
    const tr = (cls, nome, a) => '<div class="traccia ' + cls + '"><span>' + nome + '</span><strong>' + (a ? a[0] + ' / ' + a[1] : '–') + '</strong><div class="tacche">' + (a ? tacche(a[0], a[1], 12) : '') + '</div></div>';
    $('tracce').innerHTML = tr('pf', 'Punti Ferita', d.pf) + tr('stress', 'Stress', d.stress) + tr('speranza', 'Speranza', d.speranza) + tr('armatura', 'Armatura', d.armatura);
    $('condizioni').innerHTML = (d.condizioni || []).map(c => '<em>' + esc(c) + '</em>').join('');
    const box = $('abilita'); box.innerHTML = '';
    (d.abilita || []).forEach(a => {
      if (a.scelta) {
        const lab = document.createElement('label'); lab.textContent = a.label;
        const sel = document.createElement('select'); a.scelta.forEach(o => { const op = document.createElement('option'); op.value = o.id; op.textContent = o.label; if (o.id === a.val) op.selected = true; sel.appendChild(op); });
        sel.onchange = () => { invia({ tipo: 'abilita', id: a.id, val: sel.value }); vibra(15); };
        lab.appendChild(sel); box.appendChild(lab);
        if (a.info) { const sm = document.createElement('small'); sm.textContent = a.info; box.appendChild(sm); }
      } else {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = a.label; if (a.attivo) b.className = 'attivo';
        b.onclick = () => { invia({ tipo: 'abilita', id: a.id }); vibra(20); };
        box.appendChild(b);
      }
    });
  }
  const vibra = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  // ---- joystick ----
  const med = $('medaglione'), pom = $('pomello'); let dito = null, vx = 0, vy = 0, invioTimer = null;
  const muovi = e => {
    const r = med.getBoundingClientRect(), R = r.width / 2, cx = r.left + R, cy = r.top + R;
    let dx = e.clientX - cx, dy = e.clientY - cy; const d = Math.hypot(dx, dy), lim = R * 0.62;
    if (d > lim) { dx *= lim / d; dy *= lim / d; }
    pom.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
    vx = +(dx / lim).toFixed(2); vy = +(-dy / lim).toFixed(2);
  };
  const manda = () => invia({ tipo: 'joy', x: vx, y: vy });
  med.addEventListener('pointerdown', e => { if (dito !== null) return; dito = e.pointerId; med.setPointerCapture(dito); med.classList.add('premuto'); muovi(e); manda(); vibra(10); clearInterval(invioTimer); invioTimer = setInterval(manda, 100); });
  med.addEventListener('pointermove', e => { if (e.pointerId === dito) muovi(e); });
  const lascia = e => { if (e.pointerId !== dito) return; dito = null; clearInterval(invioTimer); vx = vy = 0; manda(); pom.style.transform = 'translate(-50%, -50%)'; med.classList.remove('premuto'); };
  med.addEventListener('pointerup', lascia); med.addEventListener('pointercancel', lascia);
  document.addEventListener('visibilitychange', () => { if (document.hidden && dito !== null) lascia({ pointerId: dito }); else if (!document.hidden) { tieniAcceso(); invia({ tipo: 'ciao' }); } });
  // schermo sempre acceso mentre si gioca
  let blocco = null; const tieniAcceso = async () => { try { if ('wakeLock' in navigator && !blocco) { blocco = await navigator.wakeLock.request('screen'); blocco.addEventListener('release', () => { blocco = null; }); } } catch (e) {} };
  document.addEventListener('pointerdown', tieniAcceso, { once: true });
  setInterval(statoUI, 4000);
})();
</script>
</body>
</html>
